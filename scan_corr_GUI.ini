% These are the default settings for the scan_corr_GUI
% This file will be automatically generated if it does not exist, i.e. delete it to reset the settings.

[Saving Results]
SaveLOG = 1 % 0 for false, 1 for true, save the logfile
SaveCOR = 1 % 0 for false, 1 for true, save the corrected image
SaveRES = 1 % 0 for false, 1 for true, save the residual image
SavePNG = 1 % 0 for false, 1 for true, save the final screen
SaveMAT = 1 % 0 for false, 1 for true, save the data as .mat
SaveRBT = 1 % 0 for false, 1 for true, save the RBT images
TIFdepth = 1 % 1 for 8bit, 2 for 16bit
[Image Preparation]
RotateH = 0 % number of 90 degree CC rotations for H
RotateV = 1 % number of 90 degree CC rotations for V
DatabarRemove = 1 % auto remove the databar [0=false,1=true]
ROI = 50 % the relative border around the ROI
ROI_NAN = 0 % paint pixels outside the ROI as nan in the stored iamges
[RBT correction]
RBT_flag = 1 % enable (1) or disable (0) this part
RBT_Window = 0.1 % the radius of the tukeywin
[Steps]
Steps_flag = 1 % enable (1) or disable (0) this part
LineThickness = [1 1 10 3 1] % group N pixel rows together to make a thick line that moves as one
PolyOrder = [2 2 0] % The order of the polynomial basis 0 <= p <= 5 (use 0 to disable)
Bin = [4 4 2 2 1] % bin the images to superpixels of size N
Blur = [8 4 2 1 0] % blur the images with radius R
TrustRegion = 2 % limit the iterative update to N pixels
ConvCrit = [0.01 0.01 0.01 0.01 0.0001] % convergence criteria
IterMax = 30 % max number of iterations
SubIterMax = 3 % max number of sub-iterations
InterpMethod = [3 3 3 3 5] % the bspline interpolation order 2 <= s <= 9
